<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Test Site</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #2e2b5f, #0d0f1a 45%, #05060d);
      color: #f5f7ff;
    }
    .card {
      width: min(680px, 92vw);
      border: 1px solid #ffffff22;
      background: #11152a99;
      border-radius: 18px;
      padding: 28px;
      backdrop-filter: blur(6px);
      box-shadow: 0 18px 40px #00000066;
    }
    h1 { margin: 0 0 8px; font-size: 1.9rem; }
    p { margin: 0.4rem 0; line-height: 1.5; }
    .chip {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #8f7dff33;
      border: 1px solid #b9aeff66;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Random Test Site</h1>
    <p>This is a placeholder site for GitHub Pages testing.</p>
    <p>No project content is included.</p>
    <span class="chip">Live • Random Demo</span>
  </main>
</body>
</html>
